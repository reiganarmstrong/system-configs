# Catppuccin pastel Starship theme
# Plain ASCII version: no Nerd Font, no Unicode symbols

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$cmd_duration\
$line_break\
$character"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[username]
show_always = true
style_user = "mauve bold"
style_root = "red bold"
format = "[$user]($style) "

[hostname]
ssh_only = false
style = "peach bold"
format = "on [$hostname]($style) "

[directory]
style = "blue bold"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = false

[git_branch]
style = "green bold"
format = "git:[$branch]($style) "

[git_status]
style = "red bold"
format = "[$all_status$ahead_behind]($style) "

[nodejs]
style = "yellow bold"
format = "node [$version]($style) "

[python]
style = "green bold"
format = "py [$version]($style) "

[cmd_duration]
min_time = 1000
style = "subtext0"
format = "took [$duration]($style) "

[character]
success_symbol = "[>](green bold)"
error_symbol = "[>](red bold)"
