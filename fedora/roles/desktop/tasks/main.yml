---
- name: Require Fedora and a regular desktop account
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Fedora'
      - ansible_facts.distribution_major_version | int >= 45
      - desktop_user | length > 0
      - desktop_user != 'root'
      - not desktop_autologin or desktop_vm
    fail_msg: Use an existing regular account on Fedora 45 or newer. Automatic login is limited to the rehearsal VM.

- name: Find the desktop account
  ansible.builtin.getent:
    database: passwd
    key: "{{ desktop_user }}"

- name: Record the desktop account details
  ansible.builtin.set_fact:
    desktop_home: "{{ ansible_facts.getent_passwd[desktop_user][4] }}"
    desktop_group: "{{ ansible_facts.getent_passwd[desktop_user][2] }}"
    desktop_uid: "{{ ansible_facts.getent_passwd[desktop_user][1] }}"

- name: Install GNOME and the supported desktop tools
  ansible.builtin.dnf:
    name: "{{ desktop_packages }}"
    state: present

- name: Create the desktop configuration directories
  ansible.builtin.file:
    path: "{{ desktop_home }}/{{ item }}"
    state: directory
    owner: "{{ desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0755'
  loop:
    - .config
    - .cache/fedora-desktop
    - .local/bin
    - .local/share/backgrounds
    - .local/share/gnome-shell/extensions
    - .local/share/themes
    - Pictures/Screenshots

- name: Install the Flathub desktop apps
  ansible.builtin.include_tasks: apps.yml

- name: Set up zsh, oh-my-zsh and Starship
  ansible.builtin.include_tasks: shell.yml

- name: Install the macOS-style icons
  ansible.builtin.include_tasks: icons.yml

- name: Install PaperWM and the GNOME theme
  ansible.builtin.include_tasks: appearance.yml

- name: Apply the shared native GNOME desktop settings
  ansible.builtin.include_tasks: settings.yml

- name: Create the AccountsService user directory
  ansible.builtin.file:
    path: /var/lib/AccountsService/users
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Select the GNOME Wayland session
  community.general.ini_file:
    path: "/var/lib/AccountsService/users/{{ desktop_user }}"
    section: User
    option: XSession
    value: gnome
    owner: root
    group: root
    mode: '0600'
    no_extra_spaces: true

- name: Configure the automatic login policy
  community.general.ini_file:
    path: /etc/gdm/custom.conf
    section: daemon
    option: AutomaticLoginEnable
    value: "{{ desktop_autologin | ternary('True', 'False') }}"
    mode: '0644'
    no_extra_spaces: true

- name: Configure the VM automatic login account
  community.general.ini_file:
    path: /etc/gdm/custom.conf
    section: daemon
    option: AutomaticLogin
    value: "{{ desktop_user }}"
    state: "{{ desktop_autologin | ternary('present', 'absent') }}"
    mode: '0644'
    no_extra_spaces: true

- name: Enable the graphical login service
  ansible.builtin.systemd_service:
    name: gdm
    enabled: true

- name: Inspect the default boot target
  ansible.builtin.command: systemctl get-default
  register: desktop_boot_target
  changed_when: false

- name: Boot into the graphical login screen
  ansible.builtin.command: systemctl set-default graphical.target
  when: desktop_boot_target.stdout != 'graphical.target'
  changed_when: true

- name: Start and configure the rehearsal VM session
  ansible.builtin.include_tasks: vm-session.yml
  when: desktop_vm

- name: Enable the desktop audio services
  become: true
  become_user: "{{ desktop_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ desktop_uid }}"
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - pipewire.socket
    - pipewire-pulse.socket
    - wireplumber.service
