---
- name: Fetch the pinned PaperWM release
  become: true
  become_user: "{{ desktop_user }}"
  ansible.builtin.git:
    repo: https://github.com/paperwm/PaperWM.git
    dest: "{{ desktop_home }}/.local/share/gnome-shell/extensions/paperwm@paperwm.github.com"
    version: "{{ desktop_paperwm_revision }}"
    depth: 1
  register: desktop_paperwm_source

- name: Inspect the compiled PaperWM settings schema
  ansible.builtin.stat:
    path: "{{ desktop_home }}/.local/share/gnome-shell/extensions/paperwm@paperwm.github.com/schemas/gschemas.compiled"
  register: desktop_paperwm_schema

- name: Compile PaperWM's settings schema
  become: true
  become_user: "{{ desktop_user }}"
  ansible.builtin.command:
    argv:
      - glib-compile-schemas
      - "{{ desktop_home }}/.local/share/gnome-shell/extensions/paperwm@paperwm.github.com/schemas"
  when: desktop_paperwm_source.changed or not desktop_paperwm_schema.stat.exists
  changed_when: true

- name: Check the installed GNOME Shell version
  ansible.builtin.command: gnome-shell --version
  register: desktop_shell_version
  changed_when: false

- name: Read PaperWM's supported GNOME versions
  ansible.builtin.slurp:
    src: "{{ desktop_home }}/.local/share/gnome-shell/extensions/paperwm@paperwm.github.com/metadata.json"
  register: desktop_paperwm_metadata

- name: Require a supported PaperWM and GNOME pairing
  ansible.builtin.assert:
    that:
      - >-
        (desktop_shell_version.stdout | regex_search('[0-9]+'))
        in (desktop_paperwm_metadata.content | b64decode | from_json)['shell-version']
    fail_msg: Update the pinned PaperWM revision to one supporting this GNOME version before enabling it.

- name: Create the PaperWM user config directory
  ansible.builtin.file:
    path: "{{ desktop_home }}/.config/paperwm"
    state: directory
    owner: "{{ desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0755'

- name: Install the PaperWM user stylesheet
  ansible.builtin.copy:
    src: paperwm-user.css
    dest: "{{ desktop_home }}/.config/paperwm/user.css"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0644'
  register: desktop_paperwm_user_css

# Lets the quick settings menu shrink to the toggle sizes in user.css.
- name: Install the Quick Settings Fit extension
  ansible.builtin.copy:
    src: quick-settings-fit/
    dest: "{{ desktop_home }}/.local/share/gnome-shell/extensions/quick-settings-fit@fedora-desktop/"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0644'
    directory_mode: '0755'

- name: Check for a running desktop session
  ansible.builtin.stat:
    path: "/run/user/{{ desktop_uid }}/bus"
  register: desktop_session_bus

# PaperWM only reads user.css when it is enabled.
- name: Reload PaperWM to apply the user stylesheet
  become: true
  become_user: "{{ desktop_user }}"
  environment:
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ desktop_uid }}/bus"
  ansible.builtin.shell: |
    gnome-extensions disable paperwm@paperwm.github.com
    gnome-extensions enable paperwm@paperwm.github.com
  when:
    - desktop_paperwm_user_css.changed
    - desktop_session_bus.stat.exists
  # Fails harmlessly when no GNOME Shell is running yet; the next login loads the file.
  failed_when: false
  changed_when: true

- name: Install the shared dark desktop wallpaper
  ansible.builtin.copy:
    src: wallpaper.svg
    dest: "{{ desktop_home }}/.local/share/backgrounds/fedora-desktop.svg"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0644'
