---
# The official repository checks both metadata and RPM signatures. Signing in
# is a separate, interactive step; Ansible never enrolls a machine in a tailnet.
- name: Trust the Tailscale repository signing key
  ansible.builtin.rpm_key:
    key: https://pkgs.tailscale.com/stable/fedora/repo.gpg
    fingerprint: "{{ niri_tailscale_key_fingerprint }}"
    state: present

- name: Add the Tailscale stable repository
  ansible.builtin.yum_repository:
    name: tailscale-stable
    description: Tailscale stable
    baseurl: https://pkgs.tailscale.com/stable/fedora/$basearch
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: https://pkgs.tailscale.com/stable/fedora/repo.gpg
    enabled: true

- name: Install Tailscale
  ansible.builtin.dnf:
    name: tailscale
    state: present

- name: Enable and start Tailscale
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Read the Tailscale operator setting
  ansible.builtin.command:
    argv: [tailscale, debug, prefs]
  register: niri_tailscale_preferences
  changed_when: false
  check_mode: false
  # Preferences can contain account details on an already enrolled machine.
  no_log: true

- name: Let the desktop account manage Tailscale
  ansible.builtin.command:
    argv: [tailscale, set, "--operator={{ desktop_user }}"]
  when: (niri_tailscale_preferences.stdout | from_json).OperatorUser | default('') != desktop_user
  changed_when: true
