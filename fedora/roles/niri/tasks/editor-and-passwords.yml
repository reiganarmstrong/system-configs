---
# Preserve existing VSCodium settings, extensions and project files. Removing
# only the package and this role's old repository also migrates earlier installs.
- name: Remove VSCodium
  ansible.builtin.dnf:
    name: codium
    state: absent
    autoremove: false

- name: Remove the former VSCodium repository
  ansible.builtin.yum_repository:
    name: vscodium
    state: absent

- name: Remove the former managed VSCodium icon
  ansible.builtin.file:
    path: "{{ desktop_home }}/.local/share/icons/Graphite-macOS-Light/{{ item }}"
    state: absent
  loop:
    - 1024x1024/apps/vscodium.png
    - .sources/tGFXNlf1Pq.icns

- name: Check whether Zed is already installed
  ansible.builtin.stat:
    path: "{{ desktop_home }}/.local/zed.app/bin/zed"
  register: niri_zed_binary

- name: Download the official first-install Zed bundle
  ansible.builtin.get_url:
    url: "https://github.com/zed-industries/zed/releases/download/v{{ niri_zed_version }}/zed-linux-x86_64.tar.gz"
    dest: "{{ desktop_home }}/.local/zed-{{ niri_zed_version }}.tar.gz"
    checksum: "sha256:{{ niri_zed_sha256 }}"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0644'
    timeout: 120
  when: not niri_zed_binary.stat.exists

# A fresh check-mode run has not downloaded the archive. Existing apps are
# deliberately left alone so provisioning never downgrades an updated Zed.
- name: Extract Zed into the desktop account
  become: true
  become_user: "{{ desktop_user }}"
  ansible.builtin.unarchive:
    src: "{{ desktop_home }}/.local/zed-{{ niri_zed_version }}.tar.gz"
    dest: "{{ desktop_home }}/.local"
    remote_src: true
    creates: "{{ desktop_home }}/.local/zed.app/bin/zed"
  when:
    - not niri_zed_binary.stat.exists
    - not ansible_check_mode

- name: Remove the first-install Zed archive after extraction
  ansible.builtin.file:
    path: "{{ desktop_home }}/.local/zed-{{ niri_zed_version }}.tar.gz"
    state: absent

- name: Put Zed on the account's PATH
  ansible.builtin.file:
    src: "{{ desktop_home }}/.local/zed.app/bin/zed"
    dest: "{{ desktop_home }}/.local/bin/zed"
    state: link
    force: true
    owner: "{{ desktop_user }}"
    group: "{{ desktop_group }}"

- name: Add Zed to the app launcher with its selected icon
  ansible.builtin.template:
    src: zed.desktop.j2
    dest: "{{ desktop_home }}/.local/share/applications/dev.zed.Zed.desktop"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0644'

# Flathub does not install host Polkit policies. This is Bitwarden's native
# auth_self action, not a passwordless authorization rule. Enrollment and
# enabling biometric unlock inside Bitwarden remain interactive.
- name: Install Bitwarden's native unlock policy
  ansible.builtin.copy:
    src: com.bitwarden.desktop.policy
    dest: /usr/share/polkit-1/actions/com.bitwarden.desktop.policy
    owner: root
    group: root
    mode: '0644'
