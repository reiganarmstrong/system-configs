---
# VSCodium publishes signed RPMs in its own repository (vscodium.com install
# docs). Both the packages and the repository metadata are signed with this
# key, so dnf checks them and `sudo dnf upgrade` keeps VSCodium current.
- name: Trust the VSCodium repository signing key
  ansible.builtin.rpm_key:
    key: "{{ niri_vscodium_key_url }}"
    fingerprint: "{{ niri_vscodium_key_fingerprint }}"
    state: present

- name: Add the VSCodium repository
  ansible.builtin.yum_repository:
    name: vscodium
    description: VSCodium
    baseurl: https://download.vscodium.com/rpms/
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: "{{ niri_vscodium_key_url }}"
    metadata_expire: 1h
    enabled: true

- name: Install VSCodium
  ansible.builtin.dnf:
    name: codium
    state: present

# Electron picks its secret store from XDG_CURRENT_DESKTOP. Under Niri that is
# "niri", which Electron doesn't recognise, so VSCodium would fall back to an
# unencrypted store. argv.json makes it use the Secret Service (oo7) instead.
# Niri draws no title bars, so VSCodium's own window buttons are hidden too;
# Super+Q closes windows. Both files belong to the user: keys are only added
# when missing, and comments and other settings are kept.
- name: Add the keyring and window-button settings to VSCodium
  become: true
  become_user: "{{ desktop_user }}"
  ansible.builtin.script:
    cmd: >-
      jsonc-add-missing.py {{ item.path | quote }}
      {% for key, value in item.settings.items() %}{{ (key ~ '=' ~ (value | to_json)) | quote }} {% endfor %}
    executable: /usr/bin/python3
  loop:
    - path: "{{ desktop_home }}/.vscode-oss/argv.json"
      settings: { password-store: gnome-libsecret }
    - path: "{{ desktop_home }}/.config/VSCodium/User/settings.json"
      settings: { window.controlsStyle: hidden }
  loop_control:
    label: "{{ item.path }}"
  register: niri_vscodium_settings
  changed_when: (niri_vscodium_settings.stdout | from_json).changed

- name: Report VSCodium settings files that could not be read
  ansible.builtin.debug:
    msg: >-
      {{ item.item.path }} was left unchanged ({{ (item.stdout | from_json).error }}).
      Add {{ item.item.settings | to_json }} to it yourself.
  loop: "{{ niri_vscodium_settings.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  # Check mode does not run the script, so there is no output to inspect.
  when:
    - item.stdout is defined
    - (item.stdout | from_json).error is not none
