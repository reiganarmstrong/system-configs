# Managed by Ansible (fedora/roles/niri/files/niri-portals.conf).
# Copy of the niri package's /usr/share/xdg-desktop-portal/niri-portals.conf
# with one change: Fedora 45 replaced gnome-keyring with oo7, so the Secret
# portal is oo7's (gnome-keyring stays as a fallback when it is installed).
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=oo7-portal;gnome-keyring;
