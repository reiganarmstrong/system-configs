<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2560" viewBox="0 0 3840 2560">
  <!-- Soft colour fields for the glass panels to blur. Drawn for this repo. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e7c9"/>
      <stop offset="0.45" stop-color="#9fb8e8"/>
      <stop offset="1" stop-color="#1d3fa8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="170"/>
    </filter>
  </defs>
  <rect width="3840" height="2560" fill="url(#sky)"/>
  <g filter="url(#soft)">
    <ellipse cx="700" cy="1500" rx="1100" ry="420" fill="#3fa7c9" opacity="0.75"/>
    <ellipse cx="2500" cy="900" rx="1300" ry="380" fill="#2549d6" opacity="0.8" transform="rotate(-24 2500 900)"/>
    <ellipse cx="3100" cy="1900" rx="1000" ry="520" fill="#0f2a8c" opacity="0.85"/>
    <ellipse cx="1700" cy="2300" rx="1400" ry="360" fill="#7fb2ea" opacity="0.7"/>
    <ellipse cx="2900" cy="350" rx="900" ry="260" fill="#cfe3f7" opacity="0.7" transform="rotate(-18 2900 350)"/>
    <ellipse cx="300" cy="400" rx="800" ry="300" fill="#fff4dc" opacity="0.6"/>
  </g>
</svg>
