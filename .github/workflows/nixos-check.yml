# Every change to the NixOS configuration must build before the laptop can
# pull it.
name: NixOS check

on:
  push:
    paths: ["flake.nix", "flake.lock", "nixos/**"]
  pull_request:
    paths: ["flake.nix", "flake.lock", "nixos/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Free disk space for the system build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Build both hosts
        run: |
          nix build --no-link .#nixosConfigurations.framework.config.system.build.toplevel
          nix build --no-link .#nixosConfigurations.vm.config.system.build.toplevel
      - name: Test desktop settings, media, dropdowns, clipboard and calendar synchronization
        run: nix build --no-link .#checks.x86_64-linux.settings .#checks.x86_64-linux.media .#checks.x86_64-linux.dropdowns .#checks.x86_64-linux.clipboard .#checks.x86_64-linux.calendar
