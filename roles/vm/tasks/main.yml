---
- name: Require Ubuntu, a regular user and safe VM identifiers
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.architecture == 'x86_64'
      - vm_user is match('^[a-z_][a-z0-9_-]*$')
      - vm_user != 'root'
      - vm_name is match('^[a-zA-Z0-9_-]+$')
      - vm_vnc_port | int >= 5900
      - vm_vnc_port | int <= 5999

- name: Check for the local VNC password file
  become: false
  ansible.builtin.stat:
    path: "{{ vm_vnc_password_file }}"
  register: vm_vnc_password_state

- name: Require a VNC password for macOS Screen Sharing
  ansible.builtin.assert:
    that: vm_vnc_password_state.stat.exists
    fail_msg: Create .local/vnc-password with an 8-character password as described in README.md.

- name: Validate the VNC password without logging it
  ansible.builtin.assert:
    that: vm_vnc_password is match('^[!-~]{8}$')
    fail_msg: The VNC password must contain exactly 8 printable ASCII characters without spaces.
  no_log: true

- name: Restrict access to the local VNC password file
  become: false
  ansible.builtin.file:
    path: "{{ vm_vnc_password_file }}"
    mode: '0600'

- name: Install host virtualization packages
  ansible.builtin.apt:
    name:
      - qemu-system-x86
      - qemu-system-modules-opengl
      - qemu-utils
      - libvirt-daemon-system
      - virtinst
      - cloud-image-utils
      - python3-libvirt
      - python3-lxml
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable libvirt
  ansible.builtin.systemd_service:
    name: libvirtd
    enabled: true
    state: started

- name: Allow QEMU to use the host GPU render device
  ansible.builtin.user:
    name: libvirt-qemu
    groups: render
    append: true

- name: Check the host GPU render device
  ansible.builtin.stat:
    path: "{{ vm_render_node }}"
  register: vm_render_device

- name: Require an available render device for VirtIO 3D
  ansible.builtin.assert:
    that: vm_render_device.stat.exists
    fail_msg: Set vm_render_node to an available GPU render device under /dev/dri.

- name: Start the default NAT network
  community.libvirt.virt_net:
    name: default
    state: active
    autostart: true

- name: Create the private local state directory
  become: false
  ansible.builtin.file:
    path: "{{ vm_local_directory }}"
    state: directory
    mode: '0700'

- name: Generate the VM administration SSH key
  become: false
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -q
      - -t
      - ed25519
      - -N
      - ''
      - -C
      - fedora-desktop-ansible
      - -f
      - "{{ vm_private_key }}"
    creates: "{{ vm_private_key }}"

- name: Create the guest disk directory
  ansible.builtin.file:
    path: "{{ vm_directory }}"
    state: directory
    owner: libvirt-qemu
    group: kvm
    mode: '0750'

- name: Download the verified Fedora 45 base image
  ansible.builtin.get_url:
    url: "{{ vm_image_url }}"
    checksum: "{{ vm_image_checksum }}"
    dest: "{{ vm_directory }}/base.qcow2"
    owner: libvirt-qemu
    group: kvm
    mode: '0640'

- name: Create the independent guest disk from the base image
  ansible.builtin.copy:
    src: "{{ vm_directory }}/base.qcow2"
    dest: "{{ vm_directory }}/desktop.qcow2"
    remote_src: true
    force: false
    owner: libvirt-qemu
    group: kvm
    mode: '0600'

- name: Read the guest disk capacity
  ansible.builtin.command:
    argv: [qemu-img, info, --force-share, --output=json, "{{ vm_directory }}/desktop.qcow2"]
  register: vm_disk_info
  changed_when: false

- name: Grow the guest disk to the requested capacity
  ansible.builtin.command:
    argv: [qemu-img, resize, "{{ vm_directory }}/desktop.qcow2", "{{ vm_disk_gib }}G"]
  when: (vm_disk_info.stdout | from_json)['virtual-size'] | int < (vm_disk_gib | int * 1073741824)

- name: Set guest disk ownership
  ansible.builtin.file:
    path: "{{ vm_directory }}/desktop.qcow2"
    owner: libvirt-qemu
    group: kvm
    mode: '0600'

- name: Render the VM bootstrap configuration
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ vm_directory }}/{{ item }}"
    mode: '0600'
  loop:
    - user-data
    - meta-data

- name: Create the cloud-init seed disk
  ansible.builtin.command:
    argv:
      - cloud-localds
      - "{{ vm_directory }}/seed.img"
      - "{{ vm_directory }}/user-data"
      - "{{ vm_directory }}/meta-data"
    creates: "{{ vm_directory }}/seed.img"

- name: Set seed disk ownership
  ansible.builtin.file:
    path: "{{ vm_directory }}/seed.img"
    owner: libvirt-qemu
    group: kvm
    mode: '0600'

- name: List existing virtual machines
  community.libvirt.virt:
    command: list_vms
  register: vm_domains

- name: Render the virtual machine definition
  ansible.builtin.template:
    src: domain.xml.j2
    dest: "{{ vm_directory }}/domain.xml"
    mode: '0600'
  register: vm_definition
  no_log: true

- name: Read the last successfully applied VM definition
  ansible.builtin.stat:
    path: "{{ vm_directory }}/domain-applied.xml"
    checksum_algorithm: sha1
  register: vm_applied_definition

- name: Determine whether virtual hardware needs updating
  ansible.builtin.set_fact:
    vm_hardware_changed: "{{ vm_definition.checksum != (vm_applied_definition.stat.checksum | default('')) }}"

- name: Shut down the VM before applying virtual hardware changes
  community.libvirt.virt:
    name: "{{ vm_name }}"
    state: shutdown
  when:
    - vm_hardware_changed
    - vm_name in vm_domains.list_vms

- name: Wait for shutdown before applying virtual hardware changes
  ansible.builtin.command:
    argv: [virsh, -c, 'qemu:///system', domstate, "{{ vm_name }}"]
  register: vm_power_state
  changed_when: false
  until: vm_power_state.stdout | trim == 'shut off'
  retries: 90
  delay: 2
  when:
    - vm_hardware_changed
    - vm_name in vm_domains.list_vms

- name: Ensure the console port is available for a new VM
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ vm_vnc_port }}"
    state: stopped
    timeout: 1
  when: vm_hardware_changed or vm_name not in vm_domains.list_vms

- name: Define the virtual machine
  community.libvirt.virt:
    command: define
    xml: "{{ lookup('template', 'domain.xml.j2') }}"
  when: vm_hardware_changed or vm_name not in vm_domains.list_vms
  no_log: true

- name: Record the successfully applied VM definition
  ansible.builtin.copy:
    src: "{{ vm_directory }}/domain.xml"
    dest: "{{ vm_directory }}/domain-applied.xml"
    remote_src: true
    mode: '0600'

- name: Start the virtual machine
  community.libvirt.virt:
    name: "{{ vm_name }}"
    state: running
    autostart: false

- name: Find the guest DHCP address
  ansible.builtin.command:
    argv: [virsh, -c, 'qemu:///system', domifaddr, "{{ vm_name }}", --source, lease]
  register: vm_addresses
  changed_when: false
  until: vm_addresses.stdout is search('ipv4')
  retries: 30
  delay: 2

- name: Record the guest IP address
  ansible.builtin.set_fact:
    vm_ip: "{{ vm_addresses.stdout | regex_search('(?:[0-9]{1,3}\\.){3}[0-9]{1,3}') }}"

- name: Wait for SSH in Fedora
  ansible.builtin.wait_for:
    host: "{{ vm_ip }}"
    port: 22
    timeout: 180

- name: Add the guest to this playbook run
  ansible.builtin.add_host:
    name: fedora_vm
    ansible_host: "{{ vm_ip }}"
    ansible_user: "{{ vm_user }}"
    ansible_ssh_private_key_file: "{{ vm_private_key }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ vm_local_directory }}/known_hosts"
    desktop_user: "{{ vm_user }}"
    desktop_vm: true
    desktop_autologin: true
    desktop_output: Virtual-1
  changed_when: false

- name: Save the inventory for later desktop runs
  become: false
  ansible.builtin.template:
    src: inventory.yml.j2
    dest: "{{ vm_local_directory }}/vm.yml"
    mode: '0600'
