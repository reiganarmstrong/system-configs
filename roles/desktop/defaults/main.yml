---
desktop_user: "{{ lookup('env', 'USER') }}"
desktop_autologin: false
desktop_vm: false
desktop_output: ""
desktop_output_mode: "3840x2160@60"
desktop_output_scale: 2
desktop_theme_mode: dark
desktop_glass: true
desktop_blur: false
desktop_surface_opacity: 0.96
desktop_packages:
  - git
  - python3-pip
  - niri
  - noctalia
  - gdm
  - alacritty
  - firefox
  - nautilus
  - xwayland-satellite
  - xdg-desktop-portal-gnome
  - xdg-desktop-portal-gtk
  - xdg-user-dirs
  - mesa-dri-drivers
  - pipewire
  - pipewire-pulseaudio
  - wireplumber
  - gnome-keyring
  - wl-clipboard
  - brightnessctl
  - google-noto-sans-fonts
  - google-noto-emoji-color-fonts
  - rsms-inter-fonts
