---
desktop_user: "{{ lookup('env', 'USER') }}"
desktop_autologin: false
desktop_vm: false
desktop_output: ""
desktop_output_mode: "3840x2160@60"
desktop_output_scale: 2
desktop_theme_mode: dark
desktop_icon_theme: WhiteSur-dark
desktop_whitesur_revision: 73d8040da51a9ed74e47c7366e7e9ff437601a5c
desktop_paperwm_revision: 2d460db8365b2dee235dde15103161e67df83247
desktop_extensions:
  - paperwm@paperwm.github.com
  - dash-to-dock@micxgx.gmail.com
  - quick-settings-fit@fedora-desktop
desktop_packages:
  - git
  - zsh
  - vim-enhanced
  # Node 24 (matching the Ubuntu server) owns /usr/bin/node, npm and npx; Fedora's default nodejs is 22.
  - nodejs24
  - nodejs24-bin
  - nodejs24-npm
  - nodejs24-npm-bin
  - pnpm
  - uv
  - make
  - dconf
  - python3-psutil
  - python3-gobject
  - gtk-update-icon-cache
  - gnome-shell
  - gnome-session
  - gnome-settings-daemon
  - gdm
  - gnome-control-center
  - gnome-tweaks
  - gnome-extensions-app
  - gnome-shell-extension-dash-to-dock
  # Opens terminal apps (Terminal=true) in the terminal named in ~/.config/xdg-terminals.list.
  - xdg-terminal-exec
  - gnome-text-editor
  - gnome-system-monitor
  - firefox
  - flatpak
  - nautilus
  - xdg-desktop-portal-gnome
  - xdg-desktop-portal-gtk
  - xdg-user-dirs
  - mesa-dri-drivers
  - pipewire
  - pipewire-pulseaudio
  - wireplumber
  - gnome-keyring
  - wl-clipboard
  - google-noto-sans-fonts
  - google-noto-emoji-color-fonts
  - rsms-inter-fonts
desktop_starship_version: 1.26.0
desktop_starship_sha256: b7c232b0e8249d8e55a40beb79c5c43a7d370f3f9408bd215deb0170daeaadf3
desktop_ohmyzsh_revision: 2100c630ba4bd67bb48802c3e7da893a4fdaa1a0
